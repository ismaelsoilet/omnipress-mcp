[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnipress-mcp"
version = "0.7.0"
description = "Agentic multi-channel publishing engine for Antigravity via Model Context Protocol (MCP)"
readme = "README.md"
authors = [{ name = "OmniPress Team" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "edge-tts>=6.1.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]
keywords = ["mcp", "antigravity", "publishing", "remotion", "social-media", "automation", "audio-mastering", "carousel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
s3 = ["boto3>=1.28.0"]
all = ["boto3>=1.28.0"]

[project.urls]
Homepage = "https://github.com/ismaelsoilet/omnipress-mcp"
Repository = "https://github.com/ismaelsoilet/omnipress-mcp.git"
Issues = "https://github.com/ismaelsoilet/omnipress-mcp/issues"

[project.scripts]
omnipress = "src.cli:main"
omnipress-mcp = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/channels",
    "/.agents",
    "/tests",
    "/.github",
    "*.mp4",
    "*.mp3",
    "*.wav",
    "*.jpg",
    "*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

